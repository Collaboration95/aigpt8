<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="icon" href="data:,"><title>Click · Orders</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#fff;color:#202024;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}main,header{max-width:460px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0}.logo{font-weight:900;font-size:22px;line-height:1;letter-spacing:-1px;color:#e52528}.logo span{color:#f6a800}.back{min-width:66px;min-height:44px;display:flex;align-items:center;font-size:15px;font-weight:600;margin-left:-4px}main{padding:8px 16px max(16px,env(safe-area-inset-bottom))}h1{font-size:28px;letter-spacing:-1px;margin:8px 0 16px}.sub{font-size:12px;color:#8b8b92;margin:0 0 16px}.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.toggle strong{font-size:13px}.seg{display:flex;border:1px solid #e9e9ed;border-radius:24px;background:#f6f6f8;padding:3px}.seg button{min-height:44px;min-width:85px;border:0;border-radius:22px;background:none;font-size:12px;padding:0 14px;color:#707077}.seg button[aria-pressed=true]{background:white;color:#e52528;box-shadow:0 2px 7px #00000010;font-weight:650}.order{position:relative;border:1px solid #e9e9ed;border-radius:22px;padding:16px;margin:0 0 16px;scroll-margin-top:16px}.order:target{border-color:#e52528}.meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#888891;margin-bottom:16px;gap:8px}.state{background:#fff0ef;color:#d72327;border-radius:12px;padding:6px 9px;font-weight:650;white-space:nowrap}.products{display:flex;flex-direction:column;gap:12px}.product{display:flex;align-items:center;gap:12px;min-width:0}.thumb{width:72px;flex:none}.name{font-size:14px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}.price{font-size:12px;color:#7c7c84;margin-top:4px}.delivery{font-size:12px;color:#2583c5;margin-top:16px}.delivery b{font-size:14px;margin-right:4px}.total{display:flex;justify-content:space-between;font-size:14px;margin-top:13px}.total strong{font-size:20px;letter-spacing:-.5px}.timeline{list-style:none;padding:23px 0 0;margin:18px 0 0;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #f0f0f2}.timeline li{position:relative;text-align:center;font-size:10px;color:#96969e;line-height:1.4;padding-top:23px}.timeline li:before{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:#e9e9ed;left:calc(50% - 6px);top:0;z-index:1}.timeline li:after{content:'';position:absolute;height:2px;background:#e9e9ed;top:5px;left:-50%;width:100%}.timeline li:first-child:after{display:none}.timeline .done:before,.timeline .done:after,.timeline .current:before{background:#e52528}.timeline .current{color:#e52528;font-weight:700}.timeline .current:before{box-shadow:0 0 0 5px #e5252815;animation:pulse 1.5s infinite}.timeline .done{color:#666}.celebrate{margin:16px 0 0;background:#f0fbf5;border-radius:13px;padding:12px;color:#218155;text-align:center;font-size:13px;animation:pop .45s ease-out}.empty{text-align:center;padding:55px 15px}.empty .box{font-size:48px;margin-bottom:18px}.empty h2{font-size:20px;margin:0 0 10px}.empty p{font-size:14px;color:#8a8a91}.shop{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;background:#e52528;color:white;border-radius:25px;margin-top:14px;font-size:14px;font-weight:600}@keyframes pulse{50%{box-shadow:0 0 0 8px #e525280b}}@keyframes pop{from{opacity:0;transform:scale(.94)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.order.cancelled{background:#fafafb}.order.cancelled .product{opacity:.55}.state.x{background:#efeff2;color:#6b6b73}.delivery.xd{color:#7c7c84;font-size:13px}.order.cancelled .total strong{text-decoration:line-through;color:#8b8b92}.rw{border:1px solid #e9e9ed;border-radius:18px;padding:14px 16px;margin:0 0 16px}.rw h2{font-size:15px;margin:0 0 4px}.rw .bal{font-size:24px;font-weight:800;letter-spacing:-.5px}.rw ul{list-style:none;margin:10px 0 0;padding:0;font-size:13px}.rw li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid #f0f0f2;color:#555}.rw li b{color:#18966c}.rw li b.neg{color:#d72327}</style></head><body><header><a class="back" href="/" aria-label="Back to home">← Home</a><div class="logo">click<span>.</span></div></header><main><h1>Your orders</h1><div class="toggle"><strong>Product art</strong><div class="seg" aria-label="Product art"><button id="real" type="button">Real photos</button><button id="fun" type="button">Fun art</button></div></div><p class="sub">Demo orders · simulated delivery</p><div id="rw"></div><div id="cards" aria-live="polite"></div></main><script src="/catalog.js"></script><script src="/orders.js"></script><script src="/rewards.js"></script><script>
const steps=['Preparing','Shipped','Out for delivery','Delivered'],cards=document.getElementById('cards');const won=n=>'₩'+Number(n||0).toLocaleString('en-US');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){for(const mode of ['real','fun'])document.getElementById(mode).setAttribute('aria-pressed',String(CATALOG.mode()===mode));const list=Orders.list();cards.innerHTML=list.length?list.map(o=>{const status=Orders.status(o),n=steps.indexOf(status),cx=status==='Cancelled';return `<article class="order${cx?' cancelled':''}" id="${esc(o.id)}"><div class="meta"><span>${new Date(o.createdAt).toLocaleDateString('en-GB',{day:'numeric',month:'short'})} · ${esc(o.id.slice(0,11))}</span><span class="state${cx?' x':''}">${esc(status)}</span></div><div class="products">${o.items.map(i=>{const item=CATALOG.get(i.id)||{...i,fun:'',img:i.img};return `<div class="product"><div class="thumb">${CATALOG.imgHTML(item,'product-photo')}</div><div><div class="name">${esc(i.name)}</div><div class="price">${won(i.price)}</div></div></div>`}).join('')}</div>${cx?'<div class="delivery xd">Cancelled · no delivery, nothing charged</div>':`<div class="delivery"><b>↗</b> Rocket · ${n===3?'delivered':'tomorrow 7am'}</div>`}<div class="total"><span>Total</span><strong>${won(o.total)}</strong></div>${cx?'':`<ol class="timeline" aria-label="Delivery progress">${steps.map((s,i)=>`<li class="${i<n?'done':i===n?'current':''}" ${i===n?'aria-current="step"':''}>${s}</li>`).join('')}</ol>`}${n===3?'<div class="celebrate">✦ At your door. Enjoy! ✦</div>':''}</article>`}).join(''):'<div class="empty"><div class="box">📦</div><h2>Nothing here yet</h2><p>Your next delivery starts with Guru.</p><a class="shop" href="/">Let’s shop →</a></div>'}
async function rewards(){const el=document.getElementById('rw');if(!window.REWARDS){el.innerHTML='';return}try{const sid=localStorage.getItem('t8-sid')||localStorage.getItem('sid')||'demo';const r=await (await fetch('/api/rewards?sid='+encodeURIComponent(sid))).json();const L=(r.ledger||[]).slice(-6).reverse();el.innerHTML=`<section class="rw" aria-label="Coins"><h2>Your coins</h2><div class="bal">${Number(r.balance||0).toLocaleString('en-US')} coins</div>${L.length?`<ul>${L.map(l=>`<li><span>${esc(l.note||l.kind)}</span><b class="${l.coins<0?'neg':''}">${l.coins>0?'+':''}${l.coins}</b></li>`).join('')}</ul>`:''}</section>`}catch{el.innerHTML=''}}
document.getElementById('real').onclick=()=>CATALOG.setMode('real');document.getElementById('fun').onclick=()=>CATALOG.setMode('fun');Orders.onChange(render);CATALOG.onMode(render);render();rewards();if(location.hash)requestAnimationFrame(()=>document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView({block:'start'}));
</script></body></html>
