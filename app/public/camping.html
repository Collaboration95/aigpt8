<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coupang · Camping</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#1a1a1a}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#stage{height:100dvh;display:flex}
#steps{display:none}
#phone{flex:1;display:flex;flex-direction:column;height:100dvh;background:#fff;position:relative;overflow:hidden;min-width:0}
body.board #stage{background:#eceef2;justify-content:center;align-items:center;gap:32px;height:100vh}
body.board #steps{display:flex;flex-direction:column;gap:10px;width:220px}
body.board #steps h3{font-size:14px;color:#555;margin-bottom:4px}
body.board #steps button{min-height:44px;background:#fff;border-radius:12px;padding:8px 12px;text-align:left;font-size:14px;box-shadow:0 1px 3px #0002}
body.board #phone{flex:none;width:410px;height:864px;border-radius:44px;border:10px solid #111;box-shadow:0 20px 60px #0004}
#top{display:flex;align-items:center;justify-content:space-between;height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;flex:none;background:#fff;z-index:5}
.logo{font-weight:900;font-size:22px;line-height:1;letter-spacing:-1px;color:#e52528;display:flex;align-items:center}
.logo span{color:#f6a800}
#cartb{position:relative;margin-right:-8px;width:44px;height:44px;display:grid;place-items:center}
#badge{position:absolute;top:2px;right:0;min-width:20px;height:20px;border-radius:10px;background:#e52528;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px;transform:scale(0);transition:transform .25s}
#badge.on{transform:scale(1)}
#badge.bump,#cartb.bump svg{animation:bump .6s}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.5) rotate(-12deg)}60%{transform:scale(.9)}100%{transform:scale(1)}}
#feed .blk,#feed .bub,#sp{flex:none}
#feed{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;display:flex;flex-direction:column}
#home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;transition:opacity .35s,transform .45s,max-height .5s;max-height:1000px}
#home{transition:opacity .2s,transform .2s}
#home.leave{opacity:0;transform:translateY(-24px);pointer-events:none}
body.started .surp{display:none}
.blk.frozen{opacity:.85}
.blk.morph{transform-origin:100% 0;animation:bmorph .45s cubic-bezier(.22,1,.36,1) backwards}
@keyframes bmorph{from{transform:scale(.92) translateY(24px);border-radius:26px}to{transform:none;border-radius:26px}}
.stg{animation:stg .4s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i)*60ms + 300ms)}
@keyframes stg{from{opacity:0;transform:translateY(12px)}}
#home h1{font-size:24px;font-weight:600;line-height:1.25;margin-top:18px;max-width:280px;letter-spacing:-.3px}
.mark{width:44px;height:44px;border-radius:14px;background:#e52528;display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px}
#home .spacer{flex:1}
.surp{align-self:flex-start;margin:0;min-height:44px;padding:0 16px;border:1px solid #ddd;border-radius:22px;font-size:14px;background:#fff}
#homewrap{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;width:100%}
#chiprow{width:100%;padding:0 4px;display:flex}
.bub{align-self:flex-end;margin:14px 16px 10px;background:#f1f1f3;border-radius:18px 18px 4px 18px;padding:10px 14px;font-size:15px;max-width:80%;animation:pop .3s}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}
.blk{margin:6px 16px 18px;border:4px solid #111;border-radius:26px;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(circle,rgba(0,0,0,.08) 1.3px,transparent 1.8px);background-size:9px 9px;color:var(--fg);box-shadow:5px 5px 0 #111;animation:morph .7s cubic-bezier(.2,.8,.2,1);transition:background-color .5s}
.blk.dark{--fg:#fff}
@keyframes morph{from{opacity:0;transform:scale(.9);border-radius:60px;filter:saturate(0)}}
.scene{display:block;width:100%;transition:opacity .25s}
.scene.fade{opacity:.2}
.sc{position:relative}
.sc svg{display:block;width:100%}
.inner{padding:14px 14px 16px}

.ttl{font-size:22px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 2px 10px}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:0 12px;border-radius:14px;background:var(--acc);color:#fff;font-size:13px;font-weight:700}
.rows{display:flex;flex-direction:column;gap:8px;transition:opacity .25s}
.rows.fade{opacity:0}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid #111;box-shadow:3px 3px 0 #111;border-radius:18px;padding:8px;min-height:76px}
.ico{width:56px;height:56px;border-radius:16px;background:var(--acc2);display:grid;place-items:center;flex:none}
.ico svg{width:38px;height:38px}
.meta{flex:1;min-width:0}
.nm{font-weight:700;font-size:15px;line-height:1.2}
.pr{font-weight:800;font-size:16px;margin-top:2px}
.rk{font-size:12px;font-weight:600;color:#0a7cff;margin-top:1px}
.dark .rk{color:#7cc0ff}
.dark .row{border-color:#050818;box-shadow:3px 3px 0 #050818}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin:12px 4px 10px;font-weight:700}
.sum b{font-size:22px;font-weight:900}
.shipbox{min-height:70px;margin-top:6px}
.ship{width:100%;min-height:64px;border-radius:32px;background:var(--acc);color:#fff;border:4px solid #111;box-shadow:0 5px 0 #111;font:900 italic 23px/1 Impact,"Arial Black",sans-serif;letter-spacing:.5px;text-shadow:2px 2px 0 #111;transition:transform .15s}
.ship:active{transform:translateY(4px);box-shadow:0 1px 0 #111}
.ship:disabled{opacity:.4;box-shadow:none}
.zoom{position:relative;height:64px;border-radius:32px;border:4px solid #111;background:#ffe45e;overflow:hidden;box-shadow:0 5px 0 #111;display:grid;place-items:center;background-image:repeating-linear-gradient(90deg,transparent 0 22px,rgba(0,0,0,.08) 22px 26px)}
.zoom b{font:900 italic 34px/1 Impact,"Arial Black",sans-serif;color:#fff;letter-spacing:1px;text-shadow:-2px -2px 0 #111,2px -2px 0 #111,-2px 2px 0 #111,2px 2px 0 #111,4px 4px 0 #111;animation:zw .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes zw{0%{opacity:0;transform:scale(.2) rotate(-14deg)}35%{opacity:0;transform:scale(.2) rotate(-14deg)}65%{opacity:1;transform:scale(1.25) rotate(-4deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}
.zoom svg{position:absolute;top:10px;left:-90px;width:84px;height:34px;animation:fly .75s cubic-bezier(.55,0,.9,.5) forwards}
@keyframes fly{to{left:calc(100% + 10px)}}
.rcpt{display:flex;align-items:center;gap:10px;min-height:64px;padding:6px 6px 6px 12px;border-radius:32px;background:#fff;color:#111;border:4px solid #111;box-shadow:0 5px 0 #111;animation:pop .35s}
.th{display:flex;flex:none}
.th span{width:30px;height:30px;border-radius:50%;background:var(--acc2);border:3px solid #111;display:grid;place-items:center;margin-left:-9px}
.th span:first-child{margin-left:0}
.th svg{width:20px;height:20px}
.rcpt .m{flex:1;min-width:0;line-height:1.2}
.rcpt b{display:block;font-size:17px;font-weight:900}
.rcpt small{white-space:nowrap;font-size:12px;font-weight:700;color:#0a7cff}
.blk.shipped .tog,.blk.shipped .qc,.blk.shipped .car,.blk.shipped .dots{pointer-events:none}
/* question chips */
.qs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.q{display:flex;flex-direction:column;gap:5px}
.ql{font:900 italic 15px/1 Impact,"Arial Black",sans-serif;letter-spacing:.5px;margin:0 2px}
.qr{display:flex;gap:8px;flex-wrap:wrap}
.qc{min-height:44px;min-width:60px;padding:0 14px;border:3px solid #111;border-radius:22px;background:#fff;color:#111;font-weight:800;font-size:14px;box-shadow:2px 2px 0 #111;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,box-shadow .12s,background .2s}
.qc:active{transform:translate(2px,2px);box-shadow:0 0 0 #111}
.qc.sel{background:var(--acc);color:#fff;text-shadow:1px 1px 0 #111}
.qc:disabled{cursor:default}
.blk.frozen .qc:not(.sel){opacity:.5}
.qc .bx{width:14px;height:14px;border:2.5px solid #111;border-radius:5px;background:#fff;display:inline-grid;place-items:center;flex:none;font:900 10px/1 sans-serif;color:#111;text-shadow:none}
.qc.sel .bx::after{content:"✓"}
.rows.still .stk{animation:none}
.undo{min-height:44px;padding:0 16px;color:#e52528;font-weight:800}
.undo:disabled{opacity:.35}
.strip{height:84px}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:12px 4px 2px}
.big b{font-size:40px;font-weight:900;letter-spacing:-1.5px}
.big s{font-size:18px;opacity:.6}
.save{display:inline-block;margin:4px 4px 12px;padding:6px 14px;border-radius:16px;background:#4ade80;color:#052e16;font-weight:800;font-size:14px}
.tog{min-height:44px;min-width:92px;padding:0 12px;border-radius:22px;font-weight:800;font-size:13px;background:var(--acc);color:#fff}
.tog.off{background:#fff;color:var(--acc);box-shadow:inset 0 0 0 2.5px var(--acc)}
.old{display:inline-block;font-size:12px;opacity:.6;text-decoration:line-through;margin-left:8px;font-weight:600}
/* ---------- comic turn 1 ---------- */
.blk.comic{position:relative;overflow:visible;--ink:#111}
.cb{position:relative;height:164px;border-radius:22px 22px 0 0;overflow:hidden;border-bottom:4px solid #111;background:repeating-conic-gradient(from 0deg at 50% 52%,rgba(255,255,255,.6) 0 7deg,transparent 7deg 14deg),radial-gradient(circle,rgba(0,0,0,.1) 1.3px,transparent 1.8px) 0 0/9px 9px,var(--bg);transition:background-color .5s}
.bsv{position:absolute;left:0;top:6px;width:100%;height:calc(100% - 6px);animation:bsvpop .7s cubic-bezier(.3,1.5,.5,1) .3s both;transform-origin:50% 50%}
.bsv .bf{fill:var(--bur);transition:fill .4s}
@keyframes bsvpop{0%{transform:scale(0) rotate(-40deg)}60%{transform:scale(1.15) rotate(5deg)}80%{transform:scale(.96) rotate(-2deg)}100%{transform:none}}
.word{position:absolute;left:0;right:0;top:52%;text-align:center;font:900 italic 46px/1 Impact,"Arial Black","Helvetica Neue",sans-serif;letter-spacing:1px;color:#fff;transform:translateY(-50%) rotate(-5deg);text-shadow:-3px -3px 0 #111,3px -3px 0 #111,-3px 3px 0 #111,3px 3px 0 #111,0 -3px 0 #111,0 3px 0 #111,-3px 0 0 #111,3px 0 0 #111,6px 6px 0 #111;animation:wordpop .75s cubic-bezier(.3,1.4,.5,1) .45s both;pointer-events:none}
@keyframes wordpop{0%{transform:translateY(-50%) rotate(-35deg) scale(0)}55%{transform:translateY(-50%) rotate(3deg) scale(1.3)}80%{transform:translateY(-50%) rotate(-7deg) scale(.95)}100%{transform:translateY(-50%) rotate(-5deg) scale(1)}}
.cb.hit .word{animation:whit .45s cubic-bezier(.3,1.5,.5,1)}
.cb.hit .bsv{animation:bhit .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes whit{0%{transform:translateY(-50%) rotate(-12deg) scale(.7)}60%{transform:translateY(-50%) rotate(0deg) scale(1.15)}100%{transform:translateY(-50%) rotate(-5deg) scale(1)}}
@keyframes bhit{0%{transform:scale(.8) rotate(-8deg)}60%{transform:scale(1.08) rotate(3deg)}100%{transform:none}}
.zz{position:absolute;width:64px;height:14px;animation:wordpop .5s .9s both}
.zz.a{left:8px;top:10px}.zz.b{right:8px;bottom:10px;transform:scaleX(-1)}
.bolt{position:absolute;z-index:3;pointer-events:none;width:var(--w,36px);animation:boltin .5s cubic-bezier(.3,1.6,.5,1) var(--bd,.8s) both}
.bolt svg{display:block;width:100%;transform:rotate(var(--br,0deg));animation:flick 1.9s steps(1) var(--bd,.8s) infinite}
@keyframes boltin{from{transform:scale(0)}}
@keyframes flick{0%,100%{opacity:1}70%{opacity:1}76%{opacity:.15}82%{opacity:1}88%{opacity:.3}94%{opacity:1}}
.car{position:relative;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:16px 0 12px;transition:opacity .3s}
.car::-webkit-scrollbar{display:none}
.car::before,.car::after{content:"";flex:0 0 calc(14% - 12px)}
.scard{position:relative;flex:0 0 72%;height:150px;scroll-snap-align:center;scroll-snap-stop:always;border:4px solid #111;border-radius:18px;overflow:hidden;box-shadow:4px 4px 0 #111;background:#fff;padding:0;transform:scale(.88) rotate(var(--cr,0deg));opacity:.8;transition:transform .35s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.scard:nth-child(1){--cr:-1.5deg}.scard:nth-child(2){--cr:1.5deg}.scard:nth-child(3){--cr:-1deg}.scard:nth-child(4){--cr:1deg}
.scard.on{transform:scale(1) rotate(var(--cr));opacity:1}
.scard .scene{height:100%!important;width:100%}
.scard::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(0,0,0,.28) 1.2px,transparent 1.7px) 0 0/7px 7px;-webkit-mask-image:linear-gradient(to top,#000,transparent 60%);mask-image:linear-gradient(to top,#000,transparent 60%);pointer-events:none}
.lab{position:absolute;left:8px;bottom:8px;z-index:1;padding:2px 10px;background:#ffe45e;border:3px solid #111;border-radius:8px;box-shadow:2px 2px 0 #111;font:900 italic 18px/1.2 Impact,"Arial Black",sans-serif;color:#111;transform:rotate(-3deg)}
.now{position:absolute;right:8px;top:8px;z-index:1;padding:0 8px;line-height:20px;background:#fff;border:2.5px solid #111;border-radius:10px;font-size:11px;font-weight:900;color:#111;transform:rotate(3deg)}
.dots{display:flex;justify-content:center;gap:8px;margin:0 0 6px;transition:opacity .3s}
.dots i{width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid #111;transition:transform .3s,background .3s}
.dots i.on{background:var(--acc);transform:scale(1.35)}
.car.frozen,.dots.frozen{opacity:.5;pointer-events:none}
.rows.k{gap:14px;margin-top:6px}
.stk{position:relative;display:flex;align-items:center;gap:12px;background:#fff;color:#1a1a1a;border:3px solid #111;border-radius:16px;box-shadow:4px 4px 0 #111;padding:8px 10px 8px 8px;margin:0 var(--mr,0) 0 var(--ml,0);transform:rotate(var(--r,0deg));animation:stkpop .55s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i)*40ms)}
.stk .ico{border:3px solid #111;border-radius:14px}
.stk .ico svg{filter:drop-shadow(2px 2px 0 #111)}
.pt{display:inline-block;background:#ffe45e;border:2.5px solid #111;border-radius:8px;padding:0 7px;margin:3px 0 2px;font-weight:900;font-size:16px;transform:rotate(-2deg)}
@keyframes stkpop{0%{opacity:0;transform:scale(.2) rotate(calc(var(--r) - 25deg))}60%{opacity:1;transform:scale(1.1) rotate(calc(var(--r) + 4deg))}100%{opacity:1;transform:scale(1) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.bsv,.word,.zz,.bolt,.bolt svg,.stk,.cb.hit .word,.cb.hit .bsv,.blk,.blk.morph,.pop,.gear.pulse,.qc.sel,.kitw.in{animation:none!important}.scard{transition:none}}
.qc{flex:1 1 auto;padding:0 9px;gap:5px}
.qc.sel{animation:selp .3s}
@keyframes selp{50%{transform:scale(1.12) rotate(-2deg)}}
.qc.rm{background:#ffe45e}
.blk.frozen .qc.rm:not(.sel){opacity:.5}
.game{position:relative}
.stick{position:sticky;top:0;z-index:4;background-color:var(--bg);border-top:4px solid #111;border-bottom:4px solid #111;transition:background-color .5s}
.scn svg{display:block;width:100%}
.mt{display:flex;align-items:center;gap:8px;padding:7px 14px;font:900 italic 14px/1 Impact,"Arial Black",sans-serif;letter-spacing:.4px}
.mt.bm{padding:4px 2px;margin-top:8px}
.bar{flex:1;height:18px;border:3px solid #111;border-radius:10px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:0;background-color:var(--acc);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px);transition:width .35s cubic-bezier(.3,1.4,.5,1)}
.bar i.over{background-color:#e52528}
.mt b{min-width:40px;text-align:right}
.gp{padding:12px 14px 6px}
.pn{margin-bottom:10px}
.pn .ql{margin-bottom:5px}
.qc svg{flex:none;height:22px;width:auto}
.gear{width:100%;min-height:60px;margin:2px 0 10px;border-radius:30px;background:#ffe45e;color:#111;border:4px solid #111;box-shadow:0 5px 0 #111;font:900 italic 22px/1 Impact,"Arial Black",sans-serif;letter-spacing:.5px;transition:transform .15s}
.gear:active{transform:translateY(4px);box-shadow:0 1px 0 #111}
.gear:disabled{opacity:.4;box-shadow:none}
.gear.pulse{animation:gp .9s infinite}
@keyframes gp{50%{transform:scale(1.03) rotate(-.6deg)}}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pp .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pp{from{opacity:0;transform:scale(.2)}}
.kitw{padding:2px 14px 16px}
.kitw.in{animation:kin .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes kin{from{opacity:0;transform:translateY(16px)}}
.kitw .ttl{margin:8px 2px 10px}
.kitw .qs{margin-top:12px}
.k2 .stk{animation-duration:.38s}
.kitw .sum>span:last-child{display:flex;align-items:center;gap:8px}
.k2 .stk{padding:6px 10px 6px 6px}
.k2 .ico{width:46px;height:46px}
.k2 .ico svg{width:32px;height:32px}
.k2 .nm{font-size:14px}
.k2 .pt{font-size:15px}
.op{margin-left:8px;font-size:12px;font-weight:700;opacity:.55}
.stk.gone{opacity:.6;min-height:56px}
.tg{position:absolute;top:-10px;right:8px;z-index:1;padding:0 8px;line-height:20px;border:2.5px solid #111;border-radius:10px;font:900 italic 13px/20px Impact,"Arial Black",sans-serif;transform:rotate(4deg)}
.tg.n{background:#4ade80;color:#052e16}
.tg.g{background:#ff6b6b;color:#fff}
.dl{padding:0 8px;line-height:22px;border:2.5px solid #111;border-radius:11px;font-size:13px;font-weight:900;color:#111}
.dl.dn{background:#4ade80}.dl.up{background:#ffb4a8}
.blk.kit .scn{border-bottom:4px solid #111}
#comp{flex:none;padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);background:#fff}
#comp form{display:flex;align-items:center;gap:4px;border:1px solid #ddd;border-radius:28px;padding:4px 6px;min-height:52px;box-shadow:0 2px 10px #0001}
#comp button{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;flex:none}
#comp input{flex:1;min-width:0;border:0;outline:0;font-size:16px;background:none;height:44px}
#send{background:#111;color:#fff}
/* ---------- polish ---------- */
.thk{margin:6px 16px 16px}.thk .t8-thinking{margin:0}
.trk{display:flex;justify-content:center;margin-top:12px}
.blk.shipped .trk{pointer-events:auto}
#sp{min-height:0}
.bub{margin:16px 16px 8px}
.kw .stk{padding:8px 10px 8px 8px;gap:12px}
.ab{padding:0 4px}
.fb .qc{min-height:48px}
.sum{margin:16px 4px 12px}
/* ---------- v6 turn-based path ---------- */
.blk{margin:6px 16px 16px;animation:morph .5s cubic-bezier(.2,.8,.2,1)}
.blk.frozen{opacity:1}
.blk.frozen,.blk.frozen *{pointer-events:none}
body.path #comp form{border-color:#efefef;box-shadow:none;background:#fafafa}
body.path #comp input::placeholder{color:#c8c8c8}
body.path #comp button{opacity:.55}
.path .cb{height:88px}
.path .word{font-size:34px}
.mapw{padding:8px 10px 12px}
.mapw svg{display:block;width:100%;height:auto}
.sl{font:900 italic 16px Impact,"Arial Black",sans-serif}
.sn{font:800 12px -apple-system,BlinkMacSystemFont,sans-serif;fill:#111;stroke:#fff;stroke-width:3px;paint-order:stroke}
.tag{font:900 italic 11px Impact,"Arial Black",sans-serif;fill:#111}
.rng{transform-box:fill-box;transform-origin:center;animation:ring 1.4s infinite}
@keyframes ring{from{transform:scale(1);opacity:1}to{transform:scale(1.8);opacity:0}}
.trail{display:flex;align-items:center;padding:13px 16px 2px}
.tp{position:relative;width:30px;height:30px;flex:none;border-radius:50%;border:3px solid #111;background:#fff;display:grid;place-items:center;font:900 italic 14px/1 Impact,"Arial Black",sans-serif;color:#9a9a9a}
.tp i{font-style:normal}
.tp.done{background:#4ade80;color:#052e16}
.tp.cur{background:var(--acc);color:#fff;transform:scale(1.22);box-shadow:2px 2px 0 #111;animation:curp 1.4s infinite}
@keyframes curp{50%{transform:scale(1.34) rotate(-4deg)}}

 const el=document.createElement('div');el.className='srcl';
 const crewTxt=ans.crew==='duo'||!ans.crew?'Duo · from your King bed order (Mar)':LAB[ans.crew]+' · your pick';
 el.innerHTML=`<button class="srcb" type="button" aria-expanded="false">✦ ${SEAS[ans.si].n} · ${LAB[ans.crew||'duo']} · from your past order <span>▾</span></button><div class="srcs" hidden><p>${SEAS[ans.si].n}: from today's date.<br>${crewTxt}. Demo history, not a real account.</p><div class="srcc">${['solo','duo','squad'].map(c=>`<button class="qc${c===(ans.crew||'duo')?' sel':''}" type="button" data-crew="${c}">${LAB[c]}</button>`).join('')}</div></div>`;
 const b=el.querySelector('.srcb'),sh=el.querySelector('.srcs');b.onclick=()=>{sh.hidden=!sh.hidden;b.setAttribute('aria-expanded',String(!sh.hidden))};
 return el;
}
function kitBlock(kit){
 const m=kit.mods;
 const rows=kit.items.map((it,n)=>`<div class="stk ${it.st}" data-slot="${it.slot}" style="--i:${n};--r:${[-.8,.6,-.4][n%3]}deg"><div class="ico" data-pid="${it.id}">${pimg(it.id)}</div><div class="meta"><div class="nm">${it.name}${qtyTxt(it)}</div><div><span class="pt">${won(it.price)}</span>${it.old?`<s class="op">${won(it.old)}</s>`:''}</div></div><button class="nt" data-nt aria-expanded="false">Not this</button><div class="acts">${it.canSwap?'<button class="ab" data-act="swap">Swap</button>':''}<button class="ab" data-act="cheaper"${it.canCheap?'':' disabled'}>Cheaper</button><button class="ab" data-act="remove">Remove</button></div>${it.st==='new'?'<span class="tg n">+new</span>':''}</div>`).join('');
 const gone=kit.gone.map((it,n)=>`<div class="stk gone" style="--i:${kit.items.length+n};--r:1deg"><div class="ico" data-pid="${it.id}">${pimg(it.id)}</div><div class="meta"><div class="nm"><s>${it.name}</s></div><div><s class="op" style="margin:0">${won(it.price)}</s></div></div><span class="tg g">−removed</span></div>`).join('');
 const d=kit.delta,dl=d?`<span class="dl ${d<0?'dn':'up'}">${d<0?'−':'+'}${won(Math.abs(d))}</span>`:'';
 const fb=[['pricey','Too pricey',0],['heavy','Too heavy',m.heavy]].map(([k,l,dis])=>`<button class="qc${dis?' sel':''}" data-fb="${k}"${dis?' disabled':''}>${l}</button>`).join('');
 const el=mk(`${trail(KIT,true)}<div class="kw"><div class="ttl">Kit v${kit.v}${kit.label?` <span class="chip">${kit.label}</span>`:''}</div><div class="srcmount"></div><div class="rows k">${rows}${gone}</div><div class="sum"><span>Total</span><span><b>${won(kit.total)}</b>${dl}</span></div>${shipBox(kit.total)}<div class="fb">${fb}</div></div>`,theme(),'kit');
 el.querySelector('.srcmount').append(srcLine());
 el._t=()=>kit.total;el._items=()=>kit.items.map(i=>({id:i.id,name:i.name+(i.qty>1?' ×'+i.qty:''),price:i.price,img:i.product.img}));el._ic=()=>kit.items.map(i=>i.id);
 if(!kit.items.length)el.querySelector('[data-ship]').disabled=true;
 return el;
}
CAT&&CAT.onMode(()=>document.querySelectorAll('[data-pid]').forEach(e=>{e.innerHTML=pimg(e.dataset.pid)}));
function showKit(){
 step=KIT;document.body.classList.remove('path');$('#in').placeholder='Ask anything';
 if(!ans.crew)ans.crew='duo';
 const kit=makeKit({s:{},heavy:0},null,null,1);
 kits.push(kit);add(kitBlock(kit));busy=false;
}
function activeKit(){const b=blocks[blocks.length-1];return step===KIT&&b&&b.classList.contains('kit')&&!b.classList.contains('frozen')&&!b.dataset.shipped?b:null}
function feedback(label,fn,pressed){
 const b=activeKit();if(busy||!b)return false;
 const prev=kits[kits.length-1],m=JSON.parse(JSON.stringify(prev.mods));
 if(fn(m,prev)===false)return false;
 busy=true;if(pressed)pressed.classList.add('sel');
 freeze(b);
 setTimeout(()=>bubble(label),150);
 setTimeout(()=>{const k=makeKit(m,prev,label,prev.v+1);kits.push(k);add(kitBlock(k));busy=false},520);
 return true;
}
const S_=(m,slot)=>(m.s[slot]=m.s[slot]||{});
const FB={
 pricey:(m,prev)=>{const it=prev.items.filter(x=>x.canCheap).sort((a,b)=>b.price-a.price).slice(0,2);if(!it.length)return false;it.forEach(x=>{const s=S_(m,x.slot);s.cheap=(s.cheap||0)+1})},
 heavy:m=>{if(m.heavy)return false;m.heavy=1;S_(m,'vibe').gone=1;S_(m,'gear').gone=1}
};
const FBL={pricey:'Too pricey',heavy:'Too heavy'};
function setCrew(c,label){feedback(label||LAB[c],()=>{if((ans.crew||'duo')===c)return false;ans.crew=c})}
function itemAct(row,act,btn){
 const slot=row.dataset.slot,noun={tent:'tent',bag:'bag',gear:'gear',vibe:ans.vibe==='wild'?'stove':'chair',light:'lantern'}[slot];
 const L={swap:'Swap',cheaper:'Cheaper',remove:'Remove'}[act]+' '+noun;
 feedback(L,m=>{const s=S_(m,slot);if(act==='swap')s.swap=(s.swap||0)+1;else if(act==='cheaper')s.cheap=(s.cheap||0)+1;else s.gone=1},btn);
}
function ship(){const b=activeKit();if(!b||busy||!b._t())return;shipKit(b);const bx=b.querySelector('[data-box]');if(bx)feed.scrollBy({top:bx.getBoundingClientRect().top-feed.getBoundingClientRect().top-feed.clientHeight*.4,behavior:'smooth'})}

/* ---------- input ---------- */
const DEF=['wild','duo'];
const RX=[
 [[/chill|lake|calm|relax/,'chill'],[/wild|mountain|advent/,'wild']],
 [[/solo|alone|\bone\b|\b1\b/,'solo'],[/duo|two|pair|\b2\b|couple/,'duo'],[/squad|team|group|four|crew|\b4\b/,'squad']]
];
function parse(i,l){
 for(const [r,v] of RX[i])if(r.test(l))return v;
 if(/^(pick|ok|okay|yes|go|next|skip|any)\b/.test(l)){const d=DEF[i];return typeof d==='function'?d():d}
 return null;
}
function run(t){
 t=(t||'').trim();if(!t||busy)return;
 if(step<0){start(t);return}
 const l=t.toLowerCase();
 if(step<KIT){const v=parse(step,l);if(v!=null)answer(step,v,t);return}
 if(/ship|order|buy|checkout|yes|^ok/.test(l)){ship();return}
 const cm=l.match(/\b(solo|duo|squad)\b/);if(cm){setCrew(cm[1],t);return}
 const k=/heavy|light|weight/.test(l)?'heavy':/pric|cheap|budget|expens|cost|less|save/.test(l)?'pricey':null;
 if(k)feedback(t,FB[k]);
}
function start(txt){
 step=0;busy=true;
 const h=$('#home');h.classList.add('leave');document.body.classList.add('started','path');$('#in').placeholder='Just tap';
 setTimeout(()=>{h.remove();bubble(txt)},200);
 setTimeout(async()=>{
  const host=document.createElement('div');host.className='thk';place(host);
  const steps=['Camping · weekend trip','Season · from today\'s date',window.MEMORY?'Crew · King bed → two sleepers':'Picking the shortest path'];
  if(window.AI)await AI.thinking(host,{steps,ms:1100});else await new Promise(r=>setTimeout(r,700));
  host.remove();showQ(0);
 },380);
}
const q0=new URLSearchParams(location.search).get('q');
if(q0&&q0.trim()){$('#home').style.display='none';setTimeout(()=>start(q0.trim()),0)}
$('#f').addEventListener('submit',e=>{e.preventDefault();const v=$('#in').value;$('#in').value='';run(v)});
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t||t.disabled)return;
 const d=t.dataset;
 if(d.s!==undefined){run(d.s);sp=Math.max(sp,1);return}
 if(d.a){answer(KEYS.indexOf(d.a),d.v);return}
 if(d.pick!==undefined){const b=t.closest('.blk');answer(0,b._cur());return}
 if(d.nt!==undefined){
  const row=t.closest('.stk'),on=!row.classList.contains('open');
  row.parentElement.querySelectorAll('.stk.open').forEach(r=>{r.classList.remove('open');r.querySelector('.nt').setAttribute('aria-expanded','false')});
  if(on){row.classList.add('open');t.setAttribute('aria-expanded','true');
   requestAnimationFrame(()=>{const over=row.getBoundingClientRect().bottom-(feed.getBoundingClientRect().bottom-8);if(over>0)feed.scrollBy({top:over,behavior:'smooth'})})}
  return}
 if(d.act){itemAct(t.closest('.stk'),d.act,t);return}
 if(d.fb){feedback(FBL[d.fb],FB[d.fb],t);return}
 if(d.crew){setCrew(d.crew);return}
 if(d.ship!==undefined){ship();return}
 if(d.undo!==undefined)undoKit(t.closest('.blk'));
});

/* ---------- demo hooks ---------- */
const cur=()=>blocks[blocks.length-1];
window.demoSteps=[
 ()=>run('I want to go camping'),
 ()=>answer(0,'wild'),
 ()=>answer(1,'duo'),
 ()=>feedback('Too pricey',FB.pricey),
 ()=>ship()
];
let sp=0;
document.querySelectorAll('#steps [data-step]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.step;window.demoSteps[i]();sp=i+1}));
document.addEventListener('keydown',e=>{
 if(e.target.id==='in')return;
 if(['ArrowRight','ArrowDown'].includes(e.key)&&sp<window.demoSteps.length){e.preventDefault();window.demoSteps[sp++]()}
});
</script>
</body></html>
