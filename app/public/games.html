<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coupang · Games</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f6f2ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1d1530}
body{overflow-x:hidden;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation;transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .25s,box-shadow .2s}
button:active:not(:disabled){transform:scale(.93)}
button:disabled{cursor:default}
.page{max-width:430px;margin:0 auto;padding:max(8px,env(safe-area-inset-top)) 10px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.04em;color:#e5322d}
.logo i{font-style:normal;color:#f6a800}
.top b{font-size:18px;font-weight:900;letter-spacing:-.02em;color:#5a3fd0}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0 10px}
.tab{grid-column:span 2;min-height:48px;border-radius:16px;background:#fff;font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:5px;box-shadow:0 3px 0 rgba(0,0,0,.09);white-space:nowrap;padding:0 4px;letter-spacing:-.01em}
.tab:nth-child(n+4){grid-column:span 3}
.tab span{font-size:18px;line-height:1}
.tab[aria-selected=true]{background:#1d1530;color:#fff;transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.card{position:relative;border-radius:28px;padding:14px 12px 16px;overflow:hidden;min-height:620px;display:flex;flex-direction:column;transition:background .4s}
.head{display:flex;align-items:center;justify-content:space-between;min-height:36px;margin-bottom:10px;padding:0 4px}
.head h2{margin:0;font-size:24px;font-weight:900;letter-spacing:-.03em}
.cnt{min-width:46px;text-align:center;background:#1d1530;color:#fff;border-radius:14px;padding:5px 10px;font-size:14px;font-weight:800}
.cnt:empty{visibility:hidden}
.cnt.bump{animation:hpulse .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes hpulse{40%{transform:scale(1.35)}}
.stage{flex:1;display:flex;flex-direction:column;min-width:0}
.stage.enter>*{animation:pop .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{transform:scale(.88);opacity:0}}
#cf{position:absolute;inset:0;pointer-events:none;z-index:9;width:100%;height:100%}
.f1{fill:var(--f1)}.f2{fill:var(--f2)}.f3{fill:var(--f3)}.ink{fill:#3a2418}
.ln{fill:none;stroke:var(--f2);stroke-width:5;stroke-linecap:round}
.sm{fill:none;stroke:#3a2418;stroke-width:3;stroke-linecap:round}
svg{display:block;overflow:visible}
.art{flex:none}.art svg{width:100%;height:100%}
.cta{width:100%;min-height:54px;border-radius:27px;font-size:18px;font-weight:900;color:#fff;background:linear-gradient(135deg,#ff4f8a,#ff8a3d);box-shadow:0 5px 0 rgba(160,40,70,.35)}
.cta:disabled{opacity:.45;box-shadow:none}
.rbs{display:flex;justify-content:center;gap:34px;margin-top:auto;padding-top:6px}
.rb{width:72px;height:72px;border-radius:50%;background:#fff;font-size:30px;font-weight:900;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.1)}
.rb.no{color:#e5322d}.rb.yes{color:#ff3d7f}
.pair{display:flex;gap:10px}
.pair .cta{flex:1}
.pair .cta.g{background:#fff;color:#e5322d;box-shadow:0 5px 0 rgba(0,0,0,.1)}
.hint{text-align:center;font-weight:800;font-size:15px;color:#6b5a85;margin-top:6px}
/* swipe */
.deck{position:relative;height:352px;margin:2px 6px 16px}
.sc{position:absolute;inset:0;border-radius:26px;background:#fff;box-shadow:0 7px 0 rgba(0,0,0,.07),0 14px 28px rgba(120,40,90,.18);touch-action:pan-y;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;will-change:transform;padding:10px}
.sc.back{transform:scale(.93) translateY(16px);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.sc .art{margin-bottom:4px;pointer-events:none}
.sn{font-size:22px;font-weight:900;letter-spacing:-.02em;text-align:center;pointer-events:none}
.sp{font-size:20px;font-weight:900;color:#e5322d;pointer-events:none}
.stags{display:flex;gap:6px;pointer-events:none}
.stags em,.badge{font-style:normal;font-size:12px;font-weight:800;padding:4px 10px;border-radius:12px;background:#f1ebff;color:#5a3fd0}
.stamp{position:absolute;top:18px;font-style:normal;font-weight:900;font-size:26px;border:4px solid;border-radius:12px;padding:1px 10px;opacity:0;pointer-events:none}
.stamp.l{left:16px;color:#16a34a;transform:rotate(-14deg)}
.stamp.n{right:16px;color:#e5322d;transform:rotate(14deg)}
/* price */
.pg{display:flex;flex-direction:column;align-items:center;gap:4px}
.pgart{background:rgba(255,255,255,.75);border-radius:50%;padding:12px;margin-bottom:2px}
.pgn{font-size:21px;font-weight:900;letter-spacing:-.02em;text-align:center}
.gv{font-size:38px;font-weight:900;letter-spacing:-.03em;color:#e5322d;font-variant-numeric:tabular-nums;margin-top:4px}
.pg input{margin:2px 0 0}
.rl{display:flex;justify-content:space-between;width:100%;font-size:12px;font-weight:700;color:#6b5a85;padding:0 6px;margin-bottom:10px}
#act{width:100%}
.rv{height:50px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:800;width:100%}
.rv b{font-size:26px;font-variant-numeric:tabular-nums}
.vd{font-size:14px;font-weight:900;padding:5px 12px;border-radius:14px;color:#fff;animation:pop .4s cubic-bezier(.34,1.56,.64,1) both}
.vd.spot{background:#16a34a}.vd.close{background:#2f8bff}.vd.off{background:#ff7a1a}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:48px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:16px;border-radius:8px;background:linear-gradient(90deg,#ffd23d,#ff5a8a)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;margin-top:-12px;border-radius:50%;background:#fff;border:5px solid #1d1530;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .15s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18)}
input[type=range]::-moz-range-track{height:16px;border-radius:8px;background:linear-gradient(90deg,#ffd23d,#ff5a8a)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:5px solid #1d1530}
input[type=range]:disabled{opacity:.7}
/* basket */
.mt{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 4px}
.mt b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.mt span{font-size:14px;font-weight:800;color:#6b5a85}
.meter{height:16px;border-radius:8px;background:rgba(255,255,255,.75);overflow:hidden;margin-bottom:10px}
.meter.shake{animation:nope .4s}
@keyframes nope{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.mf{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#ffb23d,#ff5a8a);transition:width .4s cubic-bezier(.34,1.56,.64,1)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.bt{position:relative;border-radius:18px;background:rgba(255,255,255,.72);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:98px;border:3px solid transparent;box-shadow:0 3px 0 rgba(0,0,0,.07)}
.bt .bn{font-size:12px;font-weight:700;line-height:1.15;text-align:center;height:28px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;padding:0 2px}
.bt .bp{font-size:13px;font-weight:900}
.bt[aria-pressed=true]{background:#fff;border-color:#1d1530;transform:translateY(-2px) scale(1.04)}
.bt .ck{position:absolute;top:-7px;right:-5px;width:24px;height:24px;border-radius:50%;background:#16a34a;display:none;place-items:center}
.bt[aria-pressed=true] .ck{display:grid;animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.ck svg{width:14px;height:14px}
/* bracket */
.rnd{align-self:center;background:#fff;border-radius:18px;padding:6px 18px;font-weight:900;font-size:16px;margin-bottom:12px}
.duel{position:relative;display:flex;gap:10px}
.dl{flex:1;min-width:0;border-radius:24px;background:#fff;padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:250px;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.dl .dn{font-size:16px;font-weight:900;text-align:center;line-height:1.2}
.dl .sp{font-size:17px}
.dl.win{transform:scale(1.06);box-shadow:0 0 0 4px #16a34a,0 6px 0 rgba(0,0,0,.08)}
.dl.lose{opacity:.3;transform:scale(.9)}
.vs{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#1d1530;color:#fff;font-weight:900;display:grid;place-items:center;font-size:15px;z-index:2;pointer-events:none}
.dots{display:flex;justify-content:center;gap:8px;margin:18px 0 6px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(0,0,0,.15);transition:background .3s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.dots i.on{background:#1d1530;transform:scale(1.25)}
/* rapid */
.rfc{position:relative;background:#fff;border-radius:26px;padding:16px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 7px 0 rgba(0,0,0,.07);margin:2px 6px 16px;min-height:320px;justify-content:center}
.tb{width:84%;height:12px;border-radius:6px;background:#f0e9ff;overflow:hidden;margin-top:8px}
.tb i{display:block;height:100%;background:linear-gradient(90deg,#ff4f8a,#ffb23d);transform-origin:left;animation:tb 2.6s linear forwards}
@keyframes tb{to{transform:scaleX(0)}}
.rx{display:flex;gap:10px;margin-top:auto}
.rx button{flex:1;min-height:84px;border-radius:24px;background:#fff;font-size:36px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 5px 0 rgba(0,0,0,.1)}
.rx button span{font-size:13px;font-weight:800}
/* result */
.res{display:flex;flex-direction:column;gap:10px}
.rh{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#5b4a78;padding:0 4px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.lc{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:19px;font-weight:900;font-size:15px;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
.lc::before{content:"✦";font-size:12px;opacity:.6}
.pks{display:grid;gap:8px}
.pk{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:8px 12px 8px 8px;min-height:66px;animation:pop .45s cubic-bezier(.34,1.56,.64,1) both;box-shadow:0 3px 0 rgba(0,0,0,.06)}
.pk .art{background:var(--f3);border-radius:14px;padding:4px}
.pk .pi{flex:1;min-width:0}
.pk .pn{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .pp{font-size:14px;font-weight:900;color:#e5322d}
.pk .tg{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.pk .tg .badge{padding:3px 8px;font-size:11px;white-space:nowrap}
.pk .tg .gem{background:#ffe9a8;color:#8a5a00}
.ship{display:grid;width:100%;min-height:58px;margin-top:6px;border-radius:29px;font-size:19px;font-weight:900;color:#fff;background:linear-gradient(135deg,#e5322d,#ff7a1a);box-shadow:0 5px 0 rgba(140,30,30,.35);place-items:center;position:relative;overflow:hidden}
.ship>span{grid-area:1/1;display:flex;align-items:center;gap:8px;transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .3s}
.ship .s2{transform:translateY(120%);opacity:0}
.ship.done{background:#16a34a;box-shadow:0 5px 0 rgba(10,90,40,.35)}
.ship.done .s1{transform:translateY(-120%);opacity:0}
.ship.done .s2{transform:none;opacity:1}
.ship svg{width:22px;height:22px}
.ship.done svg path{stroke-dasharray:24;animation:draw .5s .15s both}
@keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.again{min-height:44px;font-weight:800;font-size:15px;color:#5b4a78;align-self:center;padding:0 20px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (min-width:700px){body{background:radial-gradient(circle at 50% 0,#fff,#ece4ff)}.page{padding-top:24px}}
/* White app chrome; the game stays colourful. */
html,body{background:#fff;color:#202332}
.page{max-width:430px;padding:0 12px max(16px,env(safe-area-inset-bottom))}
.top{height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;margin:0 -12px;gap:10px;align-items:center}
.top .logo{text-decoration:none;font-size:22px;font-weight:900;line-height:1;letter-spacing:-.04em;color:#e52528;display:flex;align-items:center}
.top .logo i{color:#f6a800}
.top b{font-size:13px;font-weight:700;color:#737987;flex:1;line-height:1}
.cart{width:44px;height:44px;display:grid;place-items:center;color:#252936;margin-right:-10px}
.tabwrap{position:relative;margin:4px -12px 12px}
.tabwrap::before,.tabwrap::after{content:"";position:absolute;top:0;bottom:0;width:28px;z-index:2;pointer-events:none;opacity:0;transition:opacity .2s}
.tabwrap::before{left:0;background:linear-gradient(90deg,#fff 20%,#fff0)}

.tabwrap.l::before,.tabwrap.r::after{opacity:1}
.tabs{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0;padding:4px 16px}

.tab,.tab:nth-child(n+4){flex:none;scroll-snap-align:center;min-height:44px;padding:0 16px;border-radius:22px;background:#f2f3f6;font-size:14px;font-weight:800;box-shadow:none;white-space:nowrap;gap:6px;transform:none;color:#4a5060}
.tab span{display:inline;font-size:16px}
.tab[aria-selected=true]{background:#1d1530;color:#fff;transform:none}
.card{min-height:0;border-radius:24px;padding:16px 14px 18px}
.head{min-height:36px;margin-bottom:12px}

.stage{flex:none}
.art.product-art{display:block;background:transparent;border-radius:14px;overflow:hidden;flex:none}

.sn{font-size:20px;line-height:1.2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;padding:0 4px}
.pgn{font-size:19px;min-height:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;text-align:center}
.pgart{background:transparent;padding:0;border-radius:14px;margin-bottom:6px}
.pgart .art{width:168px!important;height:168px!important}
.pg{gap:6px}
.stags{flex-wrap:wrap;justify-content:center;gap:8px}

.deck{height:auto;aspect-ratio:auto;margin:0 0 16px;height:408px}

<body>
<div class="page">
  <div class="top"><a class="logo" href="/">coupang<i>.</i></a><b>Play & discover</b><a class="cart" href="/orders.html" aria-label="Orders"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h2l2 12h12l2-9H6M9 20h.01M18 20h.01" stroke-linecap="round"/></svg></a></div>
  <div class="tabwrap" id="tw"><div class="tabs" role="tablist" id="tabs"></div></div>
  <div class="card" id="card">
    <div class="head"><h2 id="ttl"></h2><span class="cnt" id="cnt"></span></div>
    <div class="stage" id="stage"></div>
    <canvas id="cf"></canvas>

<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const won=n=>'₩'+Math.round(n).toLocaleString('en-US');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
const pop=(el,s=1.15)=>{buzz();if(RM||!el||!el.animate)return;el.animate([{transform:'scale(1)'},{transform:'scale('+s+')',offset:.4},{transform:'scale(1)'}],{duration:360,easing:'cubic-bezier(.34,1.56,.64,1)'})};
/* ---------- art ---------- */

    drag={sx:e.clientX-px,sy:e.clientY-py/.35,s:[[performance.now(),e.clientX]]};try{fr.setPointerCapture(e.pointerId)}catch(_){}});
  deck.addEventListener('pointermove',e=>{if(!drag||busy)return;px=e.clientX-drag.sx;py=(e.clientY-drag.sy)*.35;drag.s.push([performance.now(),e.clientX]);if(drag.s.length>8)drag.s.shift();put()});
  const up=e=>{if(!drag)return;const s=drag.s,n=s[s.length-1],o=s.find(a=>n[0]-a[0]<110)||s[0];
    const v=n[0]>o[0]?(n[1]-o[1])/(n[0]-o[0]):0;drag=null;
    if(Math.abs(px)>90||(Math.abs(v)>.5&&Math.abs(px)>25))fling(px>0||(px===0&&v>0)?1:-1,v);else spring(v)};
  deck.addEventListener('pointerup',up);
  deck.addEventListener('pointercancel',()=>{if(!drag)return;drag=null;spring()});
  $('.rb.no',S).onclick=e=>{pop(e.currentTarget);fling(-1,2.4)};
  $('.rb.yes',S).onclick=e=>{pop(e.currentTarget);fling(1,2.4)};
  return{stop(){alive=false;cancelAnimationFrame(raf)},
    async auto(tok){for(let k=0;k<ids.length&&tok===run;k++){await sleep(60);$(k%3===2?'.rb.no':'.rb.yes',S).click();await sleep(300)}}}
}};
/* ================= PRICE GUESS ================= */
G.price={name:'Price guess',ico:'💰',ink:'#0a8a5a',bg:'linear-gradient(160deg,#d9f8e8,#fff4c2)',
start(S,fin,cnt){
  const ids=['tumbler','chips','sun','candle','kimchi'];let i=0,alive=true,raf=0;const log=[];
  function round(){const p=P[ids[i]];cnt((i+1)+'/'+ids.length);
    S.innerHTML=`<div class="pg"><div class="pgart">${sv(p,128)}</div><b class="pgn">${p.n}</b><div class="gv" id="gv">${won(10000)}</div><input type="range" id="rg" min="1000" max="30000" step="500" value="10000" aria-label="Price guess"><div class="rl"><span>${won(1000)}</span><span>${won(30000)}</span></div><div class="rv" id="rv"></div><div id="act"><button class="cta" id="lock">Lock in</button></div></div>`;
    enter();const rg=$('#rg'),gv=$('#gv');
    rg.oninput=()=>{gv.textContent=won(rg.value)};
    $('#lock').onclick=e=>{pop(e.currentTarget);lock(p,+rg.value)}}
  function lock(p,g){$('#rg').disabled=true;const err=(g-p.pr)/p.pr,a=Math.abs(err);
    const v=a<.12?['spot','Spot on']:a<.3?['close','Close']:err>0?['off','Too high']:['off','Too low'];
    $('#act').innerHTML='<div class="pair"><button class="cta g" id="no">✕ Pass</button><button class="cta" id="yes">♥ Worth it</button></div>';
    const rv=$('#rv');rv.innerHTML=`<span>Real</span><b id="cn">${won(RM?p.pr:0)}</b><span class="vd ${v[0]}">${v[1]}</span>`;
    if(!RM){const t0=performance.now();(function f(t){if(!alive)return;const k=clamp((t-t0)/(fast?220:480),0,1);$('#cn').textContent=won(p.pr*(1-Math.pow(1-k,3)));if(k<1)raf=requestAnimationFrame(f)})(t0)}
    buzz();if(p.item)postEvent({game:'price',stage:'guess',item_id:p.item.id,guess:g});log.push({p,err,a,ok:null});
    const nx=ok=>e=>{cancelAnimationFrame(raf);pop(e.currentTarget);log[log.length-1].ok=ok;emit(p,ok?.3:-.2,ok?'Worth it':'Pass');$$('#act button').forEach(b=>b.disabled=true);setTimeout(()=>{if(!alive)return;i++;if(i<ids.length)round();else finish()},RM?0:180)};
    $('#no').onclick=nx(0);$('#yes').onclick=nx(1)}
  function finish(){const w={},ex=[],ok=log.filter(l=>l.ok),no=log.filter(l=>!l.ok);
    ok.forEach(l=>l.p.tags.forEach(t=>w[t]=(w[t]||0)+1));no.forEach(l=>l.p.tags.forEach(t=>w[t]=(w[t]||0)-.4));
    const ma=log.reduce((a,l)=>a+l.a,0)/log.length,ms=log.reduce((a,l)=>a+l.err,0)/log.length;
    if(ma<.3)ex.push('Price-savvy');else if(ms<0)ex.push('Bargain-minded');else ex.push('Big spender');
    const avg=log.reduce((a,l)=>a+l.p.pr,0)/log.length,op=ok.length?ok.reduce((a,l)=>a+l.p.pr,0)/ok.length:0;
    if(ok.length&&op<avg*.85)ex.push('Deal hunter');
    fin({w,ex,seen:new Set(ids),pp:op})}
  round();
  const gs=[18000,3000,12000,20000,9500];
  return{stop(){alive=false;cancelAnimationFrame(raf)},
    async auto(tok){for(let k=0;k<ids.length&&tok===run;k++){await sleep(40);const rg=$('#rg');rg.value=gs[k];rg.dispatchEvent(new Event('input'));await sleep(60);$('#lock').click();await sleep(200);if(tok!==run)return;$(k%2?'#no':'#yes').click();await sleep(260)}}}
}};
/* ================= BUDGET ================= */
G.basket={name:'Budget',ico:'🧺',ink:'#c2410c',bg:'linear-gradient(160deg,#ffe7d6,#ffe0ee)',
start(S,fin,cnt){
  const ids=['chips','ramen','seaweed','matcha','hand','sheet','plant','towel','sun','candle','pet1','spark'],BUD=30000;
  const sel=new Set();let alive=true;const t0=performance.now();
  S.innerHTML=`<div class="mt"><b id="sum">${won(0)}</b><span id="left">${won(BUD)} left</span></div><div class="meter" id="mt"><div class="mf" id="mf"></div></div>
  <div class="grid3">${ids.map(id=>{const p=P[id];return`<button class="bt" aria-pressed="false" data-id="${id}">${sv(p,'full')}<span class="bn">${p.s||p.n}</span><span class="bp">${won(p.pr)}</span><i class="ck">${CHECK}</i></button>`}).join('')}</div>
  <button class="cta" id="done" disabled>Done</button>`;
    const sum=()=>[...sel].reduce((a,id)=>a+P[id].pr,0);
  function upd(){const s=sum();$('#sum').textContent=won(s);$('#left').textContent=won(BUD-s)+' left';$('#mf').style.width=s/BUD*100+'%';$('#done').disabled=sel.size<2}
  $$('.bt',S).forEach(b=>b.onclick=()=>{const id=b.dataset.id,on=sel.has(id);
    if(!on&&sum()+P[id].pr>BUD){const m=$('#mt');m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake');buzz();return}
    emit(P[id],on?-.3:.3,on?'Remove from budget':'Add to budget',{'trait:frugal':on?-.1:.1});on?sel.delete(id):sel.add(id);b.setAttribute('aria-pressed',!on);pop(b,1.08);upd()});
  $('#done').onclick=e=>{pop(e.currentTarget);e.currentTarget.disabled=true;postEvent({game:'budget',selected_ids:[...sel].map(id=>P[id].item?.id),budget:BUD});const w={},ex=[],s=sum(),ch=[...sel].map(id=>P[id]),secs=(performance.now()-t0)/1000;
    ch.forEach(p=>p.tags.forEach(t=>w[t]=(w[t]||0)+1));
    if(s/BUD>=.85)ex.push('Budget master');else if(s/BUD<.5)ex.push('Saver');
    const ap=s/ch.length;if(ap<6500)ex.push('Deal hunter');
    ex.push(secs<9?'Impulse buyer':'Planner');
    fin({w,ex:ex.slice(0,2),seen:new Set(ids),pp:ap})};
  return{stop(){alive=false},
    async auto(tok){for(const id of['chips','ramen','hand','plant','seaweed']){if(tok!==run)return;await sleep(20);$(`[data-id=${id}]`,S).click();await sleep(300)}await sleep(80);$('#done').click()}}
}};
/* ================= BRACKET ================= */
G.bracket={name:'Bracket',ico:'🏆',ink:'#0a6fb8',bg:'linear-gradient(160deg,#d9f1ff,#e3ffe9)',
start(S,fin,cnt){
  const start=['matcha','ramen','candle','sun','pet2','choco','tumbler','plant'],NAMES=['Quarter','Semi','Final'];
  let rounds=[start.slice()],r=0,m=0,step=0,alive=true,lock=false;const nxt=[],semis=[],qlose=[];let champ,finalist;
  function show(){const cr=rounds[r],a=P[cr[m*2]],b=P[cr[m*2+1]];lock=false;cnt((step+1)+'/7');
    const side=p=>`<button class="dl" data-id="${p.id}">${sv(p,'full')}<b class="dn">${p.s||p.n}</b><span class="sp">${won(p.pr)}</span></button>`;
    S.innerHTML=`<div class="rnd">${NAMES[r]}</div><div class="duel">${side(a)}${side(b)}<i class="vs">VS</i></div><div class="dots">${Array.from({length:7},(_,k)=>`<i class="${k<step?'on':''}"></i>`).join('')}</div>`;
    enter();$$('.dl',S).forEach(bn=>bn.onclick=()=>choose(bn))}
  function choose(bn){if(lock)return;lock=true;const cr=rounds[r],w=bn.dataset.id,l=cr[m*2]===w?cr[m*2+1]:cr[m*2];if(P[w].item&&P[l].item)postEvent({game:'bracket',pair:{winner:P[w].item.id,loser:P[l].item.id}});
    $$('.dl',S).forEach(x=>x.classList.add(x===bn?'win':'lose'));pop(bn,1.1);
    setTimeout(()=>{if(!alive)return;nxt.push(w);if(r===0)qlose.push(l);if(r===1)semis.push(l);if(r===2){champ=w;finalist=l}
      m++;step++;if(m*2>=cr.length){r++;rounds[r]=nxt.slice();nxt.length=0;m=0}
      if(r===3)finish();else show()},RM?0:420)}
  function finish(){const w={},ex=[],add=(id,v)=>P[id].tags.forEach(t=>w[t]=(w[t]||0)+v);
    add(champ,3);add(finalist,1.5);semis.forEach(id=>add(id,.8));qlose.forEach(id=>add(id,-.3));
    if(P[champ].rare||P[champ].tags.includes('trendy'))ex.push('Novelty seeker');
    fin({w,ex,seen:new Set(start),pp:P[champ].pr})}
  show();
  return{stop(){alive=false},
    async auto(tok){for(let k=0;k<7&&tok===run;k++){await sleep(40);$$('.dl',S)[k%3===1?1:0].click();await sleep(480)}}}
}};
/* ================= RAPID FIRE ================= */
G.rapid={name:'Rapid fire',ico:'⚡',ink:'#b45309',bg:'linear-gradient(160deg,#fff1b8,#ffe0cc)',
start(S,fin,cnt){
  const ids=['snack-2','beauty-1','snack-7','home-4','drink-7','kitchen-8','snack-3','beauty-6','drink-6','home-2'];
  ids.forEach(id=>{const item=CATALOG.get(id);if(item)P[id]={id,item,n:item.name,s:item.name,pr:item.price,cat:item.category,tags:item.tags};});
  let i=0,t0=0,tm=0,alive=true,busy=false;const log=[];
  function show(){const p=P[ids[i]];cnt((i+1)+'/'+ids.length);busy=false;
    S.innerHTML=`<div class="rfc">${sv(p,224)}<b class="sn">${p.n}</b><span class="sp">${won(p.pr)}</span><div class="tb"><i></i></div></div><div class="rx"><button data-r="-1" aria-label="Nope">🥶<span>Nope</span></button><button data-r="0" aria-label="Meh">😐<span>Meh</span></button><button data-r="1" aria-label="Want">😍<span>Want</span></button></div>`;
    enter();t0=performance.now();clearTimeout(tm);tm=setTimeout(()=>react(0,true),2600);
    $$('.rx button',S).forEach(b=>b.onclick=()=>react(+b.dataset.r,false))}
  function react(v,to){if(busy||!alive)return;busy=true;clearTimeout(tm);buzz();emit(P[ids[i]],v>0?.4:v<0?-.3:0,to?'Timed out':v>0?'Want':v<0?'Nope':'Meh',v>0?{'trait:novelty':.1}:{});
    log.push({id:ids[i],v,rt:to?null:(performance.now()-t0)/1000});i++;
    if(i>=ids.length)finish();else show()}
  function finish(){const w={},ex=[];
    log.forEach(l=>P[l.id].tags.forEach(t=>w[t]=(w[t]||0)+(l.v>0?1:l.v<0?-.5:0)));
    const rts=log.filter(l=>l.rt!=null).map(l=>l.rt),ar=rts.length?rts.reduce((a,b)=>a+b,0)/rts.length:3;
    ex.push(ar<1.1?'Impulse buyer':ar>1.8?'Planner':'Quick thinker');
    const wants=log.filter(l=>l.v>0);if(wants.some(l=>P[l.id].rare||P[l.id].tags.includes('trendy')))ex.push('Novelty seeker');
    const pp=wants.length?wants.reduce((a,l)=>a+P[l.id].pr,0)/wants.length:0;
    fin({w,ex,seen:new Set(ids),pp})}
  show();
  return{stop(){alive=false;clearTimeout(tm)},
    async auto(tok){for(let k=0;k<ids.length&&tok===run;k++){await sleep(60);$$('.rx button',S)[k%4===3?0:2].click();await sleep(280)}}}
}};
/* ---------- boot ---------- */
$('#tabs').innerHTML=['rapid','swipe','bracket','price','basket'].map(id=>[id,G[id]]).map(([id,g])=>`<button class="tab" role="tab" data-g="${id}" aria-selected="false"><span>${g.ico}</span>${g.name}</button>`).join('');
const tw=$('#tw'),tb=$('#tabs'),edge=()=>{tw.classList.toggle('l',tb.scrollLeft>4);tw.classList.toggle('r',tb.scrollLeft+tb.clientWidth<tb.scrollWidth-4)};tb.addEventListener('scroll',edge,{passive:true});addEventListener('resize',edge);setTimeout(edge,0);
$$('.tab').forEach(t=>t.onclick=()=>{pop(t,1.08);go(t.dataset.g)});
window.demoPlay=async id=>{id=id&&G[id]?id:cur;go(id);const tok=run;fast=true;await sleep(250);try{await inst.auto(tok)}finally{fast=false}return tok===run};
window.__games=Object.keys(G);
go(new URLSearchParams(location.search).get('game')||'rapid');
})();
