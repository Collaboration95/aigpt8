const inferred={room:!!window.MEMORY,baby:!!window.MEMORY,bed:!!window.MEMORY};
const fallback={net:{id:'net',name:'Canopy Net',brand:'Bedroom',price:29900},plug:{id:'plug',name:'Mosquito Plug-in',brand:'Home',price:12900},spray:{id:'spray',name:'Mosquito Spray',brand:'Home',price:6900}};
function products(){return window.CATALOG?.byCategory('mosquito')||[]}
function item(k){const all=products();if(k==='net'){const variant=all.find(x=>x.id==='net-'+SZ[size].k.toLowerCase());if(variant)return variant}return all.find(x=>((x.type||'')+' '+x.id+' '+x.name+' '+(x.tags||[]).join(' ')).toLowerCase().includes(k==='plug'?'plug':k))||fallback[k]}
const IMG={}; // per-kind photo override, e.g. {net:'/img/products/net-king.jpg'}; all net photos in the catalog are the same shot
function art(d,k,cls=''){if(window.CATALOG&&(CATALOG.mode()==='fun'||d.img))return CATALOG.imgHTML(IMG[k]&&CATALOG.mode()==='real'?{...d,img:IMG[k]}:d,cls);return `<span class="pimg">${P[k]?.svg||netSvg()}</span>`}
function productHTML(d,k){return `<span class="product-art">${art(d,k)}</span><span class="pinfo"><small class="brand">${esc(d.brand||'')}</small><b class="product-name">${esc(d.name)}</b></span>`}
function updateArt(){const distance=scr.scrollHeight-scr.clientHeight-scr.scrollTop;document.querySelectorAll('[data-product]').forEach(el=>{const d=products().find(x=>x.id===el.dataset.product)||item(el.dataset.kind);el.innerHTML=productHTML(d,el.dataset.kind)});requestAnimationFrame(()=>scr.scrollTo({top:scr.scrollHeight-scr.clientHeight-distance,behavior:'instant'}))}
window.CATALOG?.onMode(updateArt);
function cart(){const n=window.Orders?Orders.count():JSON.parse(localStorage.getItem('t8-orders')||'[]').length;$('#badge').textContent=n;$('#badge').classList.toggle('on',n>0)}
$('#cart').onclick=()=>location.href='/orders.html';window.Orders?.onChange(cart);cart();
const bottom=()=>requestAnimationFrame(()=>scr.scrollTo({top:scr.scrollHeight,behavior:'smooth'}));
function bubble(t){const b=document.createElement('div');b.className='bub';b.textContent=t;feed.append(b)}
function freeze(){feed.querySelectorAll('.blk').forEach(b=>{b.classList.add('frozen');b.querySelectorAll('button').forEach(x=>x.disabled=true)})}
function block(cls,html){const b=document.createElement('section');b.className='blk '+cls;b.innerHTML=html;feed.append(b);bottom();return b}
async function thinking(first=false){const c=document.createElement('div');c.className='thinking-host';feed.append(c);bottom();if(window.AI)await AI.thinking(c,{steps:first?['Bedroom · night bites',...(window.MEMORY?['Baby at home · from Aug order','King bed · from Mar order']:[])]:['Updating your picks'],ms:1000});else{c.textContent='✦ Thinking…';await new Promise(r=>setTimeout(r,700))}c.remove()}
async function turn(label,render,first=false){if(busy)return;busy=true;freeze();bubble(label);bottom();await thinking(first);render();busy=false}
function provenance(host,key,label){if(!host||!inferred[key]||!window.AI)return;const why=window.MEMORY?.explain(key);host.append(AI.inferred({label,because:why?.because||label}))}
function picker(){stage='compare';const b=block('night',`<div class="sc">${scene(room)}</div><div class="qs"><div class="qg"><div class="q"><span>Where?</span><div class="seg"><button class="ctl ${room==='bed'?'on':''}" data-room="bed">Bedroom</button><button class="ctl ${room==='living'?'on':''}" data-room="living">Living</button></div></div><div class="provenance room-memory"></div></div><div class="qg"><div class="q"><span>Baby at home?</span><div class="seg"><button class="ctl ${!baby?'on':''}" data-baby="0">No</button><button class="ctl ${baby?'on':''}" data-baby="1">Yes</button></div></div><div class="provenance baby-memory"></div></div></div><div class="pad"><div class="cards"></div></div>`);
provenance(b.querySelector('.room-memory'),'room','Bedroom curtain order');provenance(b.querySelector('.baby-memory'),'baby','Aug baby monitor order');
const order=baby?['net','plug','spray']:room==='bed'?['net','spray','plug']:['plug','net','spray'];
b.querySelector('.cards').innerHTML=order.map(k=>{const d=item(k);const bad=baby&&k==='spray';return `<button class="card ctl ${baby&&k==='net'?'bestc':''}" data-k="${k}" aria-label="Pick ${P[k].n}">${baby&&k==='net'?'<span class="best">Best pick</span>':''}<div class="product" data-product="${esc(d.id)}" data-kind="${k}">${productHTML(d,k)}</div><span class="meta"><span class="pr">${won(d.price||P[k].p)}</span><span class="safety ${bad?'bad':k==='net'?'ok':''}">${bad?'Not baby-safe':k==='net'?'No chemicals':k==='plug'?'Check label':'Strong scent'}</span></span><span class="pick">Pick</span></button>`}).join('');
b.querySelectorAll('[data-room]').forEach(x=>x.onclick=()=>{room=x.dataset.room;inferred.room=false;turn(x.textContent,picker)});b.querySelectorAll('[data-baby]').forEach(x=>x.onclick=()=>{baby=x.dataset.baby==='1';inferred.baby=false;turn('Baby · '+x.textContent,picker)});b.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{selected=x.dataset.k;x.classList.add('sel');turn(P[selected].n,details)});}
function bedSvg(s,on){return `<svg width="${s.w+12}" height="56" viewBox="0 0 ${s.w+12} 64"><rect x="2" y="2" width="${s.w+8}" height="60" rx="8" fill="${on?'#ffd0d6':'#e5e0fa'}"/><rect x="6" y="8" width="${s.w}" height="12" rx="5" fill="#fff"/><rect x="6" y="26" width="${s.w}" height="32" rx="5" fill="${on?'#ff8aa1':'#b8aef0'}"/></svg>`}
function price(d){if(products().some(x=>x.id===d.id))return Number(d.price);return selected==='net'?Number(d.price||29900)+(size===2?7000:size===0?-5000:0):Number(d.price||P[selected].p)}
function details(){stage='detail';const d=item(selected),total=price(d);const b=block('sun',`<div class="detail-product product" data-product="${esc(d.id)}" data-kind="${selected}">${productHTML(d,selected)}</div>${selected==='net'?`<h2>Bed size</h2><div class="sizes">${SZ.map((s,i)=>`<button class="size ctl ${i===size?'on':''}" data-size="${i}">${bedSvg(s,i===size)}${s.k}<small>${s.d}</small></button>`).join('')}</div><div class="provenance bed-memory"></div>`:''}<div class="shipbar"></div><button class="cheaper ctl">Cheaper?</button>`);
provenance(b.querySelector('.bed-memory'),'bed','Mar bed frame order');b.querySelectorAll('[data-size]').forEach(x=>x.onclick=()=>{size=+x.dataset.size;inferred.bed=false;turn(SZ[size].k,details)});shipButton(b.querySelector('.shipbar'),d,total);b.querySelector('.cheaper').onclick=()=>turn('Cheaper?',cheaper);}
function addOrder(d,total){const input={items:[{...d,price:total,name:d.name+(selected==='net'&&!products().some(x=>x.id===d.id)?' · '+SZ[size].k:'')}],total,flow:'mosquito'};if(window.Orders)return Orders.add(input);const o={...input,id:'T8-'+Date.now(),createdAt:Date.now()};const a=JSON.parse(localStorage.getItem('t8-orders')||'[]');localStorage.setItem('t8-orders',JSON.stringify([o,...a]));return o}
function cancelOrder(o){if(window.Orders?.remove)Orders.remove(o.id);else if(window.Orders?.cancel)Orders.cancel(o.id);else{const a=JSON.parse(localStorage.getItem('t8-orders')||'[]');localStorage.setItem('t8-orders',JSON.stringify(a.filter(x=>x.id!==o.id)));window.dispatchEvent(new Event('t8-orders'))}cart()}
function shipButton(host,d,total){host.innerHTML=`<button class="ship ctl">Ship it · ${won(total)}</button><div class="scap">Rocket · tomorrow</div>`;host.querySelector('button').onclick=()=>turn('Ship it',()=>{const order=addOrder(d,total);cart();const b=block('receipt-block',`<div class="rcpt"><div class="ri"><b>Ordered · ${won(total)}</b><span>${esc(d.name)}</span></div><button class="undo ctl">Undo</button></div><div class="acts"><span class="tracking"></span><button class="cheaper ctl">Cheaper?</button></div>`);if(window.AI)b.querySelector('.tracking').append(AI.trackLink(order));else b.querySelector('.tracking').innerHTML='<a href="/orders.html" class="track-fallback">Track order →</a>';b.querySelector('.undo').onclick=()=>turn('Undo',()=>{cancelOrder(order);block('undone','<h2>Order cancelled</h2>');details()});b.querySelector('.cheaper').onclick=()=>turn('Cheaper?',cheaper)})}
function cheaper(){stage='cheap';const base=item('net'),old=Number(base.price||29900),all=products().filter(d=>/net/i.test(d.id+' '+d.name)&&Number(d.price)<old).sort((a,b)=>a.price-b.price);const list=all.slice(0,2);if(!list.length)list.push({...base,id:'basic-net',name:'Basic Hanging Net',price:15900},{...base,id:'dome-net',name:'Dome Net',price:19900});const b=block('mint',`<h2>Cheaper nets</h2><div class="two">${list.map(d=>`<div class="nc"><div class="product" data-product="${esc(d.id)}" data-kind="net">${productHTML(d,'net')}</div><span class="pxs"><span class="old">${won(old)}</span><span class="new">${won(d.price)}</span></span><div class="sh"></div></div>`).join('')}</div>`);b.querySelectorAll('.sh').forEach((host,i)=>shipButton(host,list[i],list[i].price))}
function start(text){if(stage!=='home')return;$('#phone').classList.add('started');$('#form').hidden=true;$('#sur').hidden=true;turn(text||'mosquitoes keep biting me at night',picker,true)}
$('#form').onsubmit=e=>{e.preventDefault();start(inp.value.trim());inp.blur()};$('#sur').onclick=()=>start();
document.querySelectorAll('#side button').forEach(x=>x.onclick=()=>{if(stage==='home')start();else if(stage==='compare'){selected='net';turn('Net',details)}else turn('Cheaper?',cheaper)});
const query=new URLSearchParams(location.search).get('q');if(query)start(query);
</script></body></html>
