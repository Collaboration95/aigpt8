<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Coupang AI">
<meta name="theme-color" content="#ffffff"><link rel="manifest" href="/manifest.webmanifest">
<title>Coupang</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#1a1a1a}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column}
#top{flex:none;display:flex;align-items:center;justify-content:space-between;height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0}
.logo{font-weight:900;font-size:22px;line-height:1;letter-spacing:-1px;color:#e52528}.logo span{color:#f6a800}
#orders{width:44px;height:44px;margin-right:-8px;display:grid;place-items:center;position:relative}
#home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 24px;text-align:center;min-height:0}
.mark{width:44px;height:44px;border-radius:14px;background:#e52528;display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px}
h1{font-size:24px;font-weight:600;line-height:1.25;margin-top:18px;max-width:280px;letter-spacing:-.3px}
#chips{flex:none;display:flex;gap:8px;padding:0 14px 8px}
.surp{min-height:44px;padding:0 16px;border:1px solid #ddd;border-radius:22px;font-size:14px;background:#fff}
#comp{flex:none;padding:8px 12px max(10px,env(safe-area-inset-bottom))}
#comp form{display:flex;align-items:center;gap:4px;border:1px solid #ddd;border-radius:28px;padding:4px 6px 4px 16px;min-height:52px;box-shadow:0 2px 10px #0001}
#comp input{flex:1;min-width:0;border:0;outline:0;font-size:16px;background:none;height:44px}
#send{width:44px;height:44px;border-radius:22px;background:#111;display:grid;place-items:center;flex:none}
</style></head><body>
<div id="app">
 <div id="top"><div class="logo">coupang<span>.</span></div>
  <a id="orders" href="/orders.html" aria-label="Orders"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h10.2L20 7H6"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg></a></div>
 <div id="home"><div class="mark">C</div><h1>Hey Guru, what are you planning to buy?</h1></div>
 <div id="chips"><button class="surp" id="surp">Surprise me</button></div>
 <div id="comp"><form id="f" autocomplete="off"><input id="in" placeholder="Ask anything" enterkeyhint="send">
  <button id="send" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></form></div>
</div>
<script>
// Route a request to its flow. Each flow page auto-runs ?q= as the first message.
const ROUTES=[[/tooth|paste|brush/i,'toothpaste'],[/mosquit|bite|bug|net\b|insect/i,'mosquito'],[/camp|tent|hike|trip/i,'camping'],[/surprise|game|play|bored/i,'games']];
function go(q){q=(q||'').trim();if(!q)return;const r=ROUTES.find(([re])=>re.test(q));location.href=`/${r?r[1]:'games'}.html?q=${encodeURIComponent(q)}`}
f.onsubmit=e=>{e.preventDefault();go(document.getElementById('in').value)};
surp.onclick=()=>go('Surprise me');
</script></body></html>
